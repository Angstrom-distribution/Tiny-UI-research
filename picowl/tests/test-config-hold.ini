# [app.*]/[layer.*] rules around a non-default [touch]

[app.early]
hold_ms = 1200

[app.explicit]
hold_action = right-click
hold_ms = 100

[app.unset]
hold_ms = 100

[app.equal]
hold_delay_ms = 500
hold_ms = 500

[layer.osk]
hold_delay_ms = 100

[touch]
hold_action = none
hold_delay_ms = 200
hold_ms = 700
slop_px = 10

[app.late]
slop_px = 20
