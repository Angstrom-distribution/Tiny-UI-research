# [layout] stack with spaces and a third name, and [app.*] aspect values

[layout]
stack =  mediaplayer , havoc , third
bogus = 1

[app.mediaplayer]
aspect = 4:3

[app.havoc]
aspect = 0:3

[app.bad.x]
aspect = 16x9

[app.bad.big]
aspect = 5000:1

[app.bad.three]
aspect = 4:3:2

[app.bad.neg]
aspect = -4:3

[app.bad.space]
aspect = 4 : 3

[app.bad.empty]
aspect =

[app.max]
aspect = 4096:1

[app.min]
aspect = 1:1

# later key wins, a bad later key keeps the earlier value
[app.twice]
aspect = 3:2
aspect = nonsense

[layer.osk]
aspect = 4:3
