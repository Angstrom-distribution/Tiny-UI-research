# hold_button at [touch], [app.*] and [layer.*] level, rules before [touch]

[app.havoc]
hold_button = middle

[app.inherit]
hold_ms = 1000

[app.back]
hold_button = right

[app.badvalue]
hold_button = primary

[app.badtiming]
hold_button = right
hold_ms = 10

[layer.osk]
hold_button = middle

[layer.plain]
slop_px = 4

[touch]
hold_button = middle
