# Test configuration file for picowl

[render]
format = XRGB8888

[output]
DSI-1 = 90
* = normal

[idle]
timeout_ms = 30000

[background]
color = #202020

[autostart]
cmd = echo "Started"
cmd = picowl-panel

[keybindings]
alt+Tab = cycle
logo+Escape = quit
code:116 = blank
alt+F4 = close
logo+Return = spawn xterm

[touch]
hold_action = right-click
hold_delay_ms = 300
hold_ms = 900
slop_px = 8

[cursor]
hold_animation = builtin
fill = #2050c0
outline = #ffffff
frame_interval_ms = 83

[rotation]
DSI-1 = hardware
* = auto

[copytype]
DSI-1 = yes
* = no

[zerocopy]
enable = yes
single_buffer = true
panel_autohide = false

[lease]
enable = no
allow = mediaplayer, vlc ,foot

[memory]
arena_max = 2
trim_threshold_kb = 512
mmap_threshold_kb = 256
top_pad_kb = 32
trim_after_start = true

[power]
backlight = auto
low_capacity = 20
dim_level = 40
poll_s = 600

[power.ac]
dim_after_s = 180
blank_after_s = 900

[power.battery]
dim_after_s = 30
blank_after_s = 120
inhibit = no

[power.low]
dim_after_s = 15
blank_after_s = 45
max_brightness_pct = 50
