# Test configuration file for picowl

[render]
format = XRGB8888

[output]
DSI-1 = 90
* = normal

[idle]
timeout_ms = 30000

[background]
color = #202020

[autostart]
cmd = echo "Started"
cmd = picowl-panel

[keybindings]
alt+Tab = cycle
logo+Escape = quit
code:116 = blank
alt+F4 = close
logo+Return = spawn xterm
