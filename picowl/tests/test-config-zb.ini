# [zerocopy] limits and [app.*] buffer pools

[zerocopy]
max_buffers_per_client = 5
budget_kb = 1024
total_kb = 3072

[app.mediaplayer]
zerocopy_buffers = 7
exe = /bin/../bin/sh

[app.org.example.Player]
zerocopy_buffers = 2
zerocopy_budget_kb = 0

[app.holdonly]
hold_ms = 1000

[app.bad]
zerocopy_buffers = 0
zerocopy_budget_kb = 70000

[app.noexe]
zerocopy_budget_kb = 500
exe = /nonexistent/dir/player

[layer.osk]
zerocopy_buffers = 4

[app.mediaplayer]
zerocopy_budget_kb = 4200
